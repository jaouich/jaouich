name: android-apk
on:
  push:
    branches: [android-app]
    paths-ignore: ["out/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build (APK non signée)
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK and signing tools
        run: |
          mkdir -p out/tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/magiscom-desk-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/34.* | tail -1)
          echo "build-tools: $BT"
          cp $BT/lib/apksigner.jar out/tools/
          cp $BT/zipalign out/tools/
          if [ -f $BT/lib64/libc++.so ]; then cp $BT/lib64/libc++.so out/tools/; fi
          $BT/zipalign -c -P 16 -v 4 out/magiscom-desk-unsigned.apk | tail -3 || true
          ls -la out out/tools
      - name: Commit
        run: |
          git config user.name "android-bot"
          git config user.email "android-bot@users.noreply.github.com"
          git add -f out
          git commit -m "APK construite (non signée) + outils de signature"
          git push
