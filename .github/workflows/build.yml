name: rekordo-build
on:
  push:
    branches: [rekordo]
    paths-ignore: ["out/**", "test/**", "store/**", ".github/workflows/emulator.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK + AAB (non signés)
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "android-bot"; git config user.email "android-bot@users.noreply.github.com"
          mkdir -p out; grep -E "error:|warning:|FAILURE|What went wrong|\.java:[0-9]+" build.log | head -150 > out/build-errors.txt; tail -60 build.log >> out/build-errors.txt
          git add -f out/build-errors.txt; git commit -m "Erreurs de compilation"; git push
      - name: Collect
        run: |
          rm -rf out; mkdir -p out/tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/rekordo-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab out/rekordo-unsigned.aab
          BT=$(ls -d $ANDROID_HOME/build-tools/35.* $ANDROID_HOME/build-tools/34.* 2>/dev/null | tail -1)
          cp $BT/lib/apksigner.jar out/tools/; cp $BT/zipalign out/tools/
          if [ -f $BT/lib64/libc++.so ]; then cp $BT/lib64/libc++.so out/tools/; fi
          grep -cE "warning:" build.log > out/warnings-count.txt || true
          ls -la out out/tools
      - name: Commit
        run: |
          git config user.name "android-bot"; git config user.email "android-bot@users.noreply.github.com"
          git add -f out; git commit -m "Rekordo construit (APK + AAB non signés)"; git push
