<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pi Oasis</title>
  <meta name="theme-color" content="#0f6b4a">
  <meta name="description" content="A farming & trading game in a Moroccan oasis. Plant, harvest, stake dates and climb the weekly leaderboard.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pi Oasis">
  <meta property="og:description" content="A farming & trading game in a Moroccan oasis. Plant, harvest, stake dates and climb the weekly leaderboard.">
  <meta property="og:image" content="https://pi-oasis.jaouich.workers.dev/logo-1024.png">
  <meta property="og:url" content="https://pi-oasis.jaouich.workers.dev/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <!-- Oasis scene: the sky follows the player's time of day -->
  <header class="hero day" id="hero">
    <div class="sky" aria-hidden="true"><i class="stars"></i><i class="sun"></i></div>
    <svg class="dunes" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="d-back" d="M0 70 C70 40 130 48 200 70 C270 92 330 60 400 44 L400 120 L0 120 Z"/>
      <g class="palm" transform="translate(214 26) scale(.52)">
        <path d="M-6 96 C-2 60 6 30 18 4 L26 8 C14 34 8 62 6 96 Z"/>
        <path d="M22 4 C0 -18 -30 -18 -54 -4 C-28 -8 -6 0 14 14 Z"/>
        <path d="M22 4 C12 -24 -10 -40 -38 -40 C-12 -30 6 -14 16 10 Z"/>
        <path d="M22 4 C30 -24 52 -40 80 -42 C56 -30 40 -14 30 10 Z"/>
        <path d="M22 4 C46 -16 76 -16 98 0 C72 -6 50 0 30 14 Z"/>
        <path d="M22 4 C22 -24 12 -44 -4 -58 C16 -48 30 -28 30 4 Z"/>
      </g>
      <g class="palm" transform="translate(160 46) scale(.36)">
        <path d="M-6 96 C-2 60 6 30 18 4 L26 8 C14 34 8 62 6 96 Z"/>
        <path d="M22 4 C0 -18 -30 -18 -54 -4 C-28 -8 -6 0 14 14 Z"/>
        <path d="M22 4 C12 -24 -10 -40 -38 -40 C-12 -30 6 -14 16 10 Z"/>
        <path d="M22 4 C30 -24 52 -40 80 -42 C56 -30 40 -14 30 10 Z"/>
        <path d="M22 4 C46 -16 76 -16 98 0 C72 -6 50 0 30 14 Z"/>
      </g>
      <path class="d-front" d="M0 96 C90 70 170 84 250 100 C310 112 360 98 400 88 L400 120 L0 120 Z"/>
    </svg>
    <div class="hero-top">
      <div class="brand"><img src="logo.svg" alt="" width="34" height="34"><span data-i18n="brand"></span></div>
      <div class="hero-tools">
        <button id="helpBtn" class="help-btn" type="button" aria-label="Guide">?</button>
        <select id="langSelect" class="lang" aria-label="Language">
          <option value="ar">ع</option>
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
      </div>
    </div>
    <div class="hero-stats">
      <div class="coin-pill" id="coinPill"><span class="coin">🪙</span><b id="dates">0</b></div>
      <button class="tier-pill tp0" id="tierBadge" type="button"></button>
    </div>
  </header>

  <!-- Shown when the game is opened through the old App Studio app: one tap to the official app -->
  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <img src="logo.svg" alt="" width="96" height="96">
      <h2 data-i18n="gate.title"></h2>
      <p data-i18n="gate.text"></p>
      <a id="gateLink" class="btn gold" href="https://oasisgame6033.pinet.com" target="_top" data-i18n="gate.btn"></a>
      <button id="gateStay" class="gate-stay" type="button" data-i18n="gate.stay"></button>
    </div>
  </div>
  <div id="movedBar" class="moved-bar hidden">
    <span data-i18n="moved.text"></span>
    <a id="movedLink" class="btn small" href="https://oasisgame6033.pinet.com" target="_top" data-i18n="moved.btn"></a>
  </div>
  <div id="loginBar" class="login-bar">
    <span id="userLabel" data-i18n="login.prompt"></span>
    <button id="loginBtn" class="btn small gold" data-i18n="login.btn"></button>
  </div>

  <!-- Jerry Kombat: a full-screen page of its own -->
  <div id="kombat" class="kombat hidden" aria-hidden="true">
    <div class="k-top">
      <button id="kBack" class="k-back" type="button">‹ <span data-i18n="k.back"></span></button>
      <div class="k-title">⚔️ Jerry Kombat</div>
      <div class="k-top-r"><button id="kSound" class="k-back" type="button" aria-label="Sound">🔊</button><button id="kLeagueBtn" class="k-league-pill" type="button"></button></div>
    </div>
    <div id="kBossSheet" class="k-levelup hidden"><div class="k-lu-card k-boss-card">
      <div id="kBsIcon" class="k-lg-icon"></div><h2 id="kBsName"></h2><p id="kBsHp" class="k-note"></p>
      <p class="k-note" data-i18n="k.boss.how"></p>
      <div id="kBsTop" class="k-top-list"></div>
      <p id="kBsLast" class="k-note"></p>
      <button id="kBsClaim" class="btn gold k-wide hidden" type="button"></button>
      <button id="kBsClose" class="btn secondary k-wide" type="button" data-i18n="k.close"></button>
    </div></div>
    <div id="kLevelUp" class="k-levelup hidden"><div class="k-lu-card"><div id="kLuIcon" class="k-lg-icon"></div><h2 data-i18n="k.lu.t"></h2><p id="kLuName"></p><button class="btn gold" data-i18n="k.lu.btn" type="button"></button></div></div>
    <div id="kFuryBanner" class="k-fury-banner hidden">🔥 <span data-i18n="k.furyOn"></span> ×3 <b id="kFuryLeft"></b></div>
    <div class="k-stats">
      <div><small data-i18n="k.perTap"></small><b id="kTapV">+1</b></div>
      <div><small data-i18n="k.pph"></small><b id="kPph">0</b></div>
      <div><small data-i18n="k.energy"></small><b id="kEnergyTxt">0</b></div>
    </div>
    <div class="k-coins"><i class="kcoin"></i><b id="kCoins">0</b></div>
    <div class="k-pages">
      <section class="k-page active" data-kp="arena">
        <button id="kBoss" class="k-boss" type="button">
          <span id="kBossIc" class="k-boss-ic">🦂</span>
          <span class="k-boss-body"><b id="kBossName"></b><span class="k-hp"><i id="kBossBar"></i><em id="kBossHp"></em></span><small id="kBossMine"></small></span>
          <span id="kBossGo" class="k-boss-go">⚔️</span>
        </button>
        <div class="k-progress"><span id="kLgName"></span><div class="k-bar"><i id="kLgBar"></i></div></div>
        <div id="kArena" class="k-arena">
          <button id="kChest" class="k-chest hidden" type="button" aria-label="Treasure">🏺</button>
          <div id="kCombo" class="k-combo hidden"></div>
          <div id="kMedal" class="k-medal"><div class="k-ring"></div><div class="k-inner">
            <!-- Jerry the fennec fighter (original drawing) -->
            <svg class="k-jerry" viewBox="0 0 200 200" aria-hidden="true">
              <path d="M58 96 L22 14 Q60 30 92 70 Z" fill="#f0a446"/><path d="M60 88 L36 32 Q62 44 84 72 Z" fill="#ffc7c0"/>
              <path d="M142 96 L178 14 Q140 30 108 70 Z" fill="#f0a446"/><path d="M140 88 L164 32 Q138 44 116 72 Z" fill="#ffc7c0"/>
              <ellipse cx="100" cy="118" rx="64" ry="56" fill="#f3a84c"/>
              <path d="M40 124 Q64 178 100 178 Q136 178 160 124 Q140 150 100 150 Q60 150 40 124 Z" fill="#fff4e6"/>
              <ellipse cx="100" cy="146" rx="32" ry="22" fill="#fff4e6"/>
              <g class="k-bandg">
                <path class="k-band1" d="M38 82 Q100 58 162 82 L160 98 Q100 76 40 98 Z"/>
                <path class="k-band2" d="M158 86 Q182 84 192 98 Q176 96 166 100 Q182 108 186 122 Q168 112 156 98 Z"/>
                <circle cx="100" cy="84" r="7" fill="#ffd76a"/>
              </g>
              <g class="sk sk-turban">
                <path d="M34 92 Q36 40 100 36 Q164 40 166 92 Q100 70 34 92 Z" fill="#f7f1e3"/>
                <path d="M40 80 Q100 52 160 80 M44 66 Q100 44 156 66" stroke="#d9cdb2" stroke-width="5" fill="none"/>
                <circle cx="100" cy="66" r="10" fill="#1f9d6b"/><path d="M100 56 L104 40 L96 40 Z" fill="#e2263b"/>
              </g>
              <g class="sk sk-crown">
                <path d="M58 70 L64 30 L82 52 L100 22 L118 52 L136 30 L142 70 Z" fill="#ffd34d" stroke="#b77b0c" stroke-width="3"/>
                <circle cx="100" cy="46" r="6" fill="#e2263b"/><circle cx="72" cy="58" r="4.5" fill="#4be3ff"/><circle cx="128" cy="58" r="4.5" fill="#4be3ff"/>
              </g>
              <g class="k-eyes">
                <ellipse cx="76" cy="114" rx="9" ry="11" fill="#2b1a12"/><circle cx="79" cy="110" r="3.2" fill="#fff"/>
                <ellipse cx="124" cy="114" rx="9" ry="11" fill="#2b1a12"/><circle cx="127" cy="110" r="3.2" fill="#fff"/>
              </g>
              <g class="sk sk-shades">
                <path d="M56 104 Q76 96 94 104 L92 120 Q76 130 60 120 Z M106 104 Q124 96 144 104 L140 120 Q124 130 108 120 Z" fill="#14121c"/>
                <path d="M94 106 L106 106" stroke="#14121c" stroke-width="5"/>
                <path d="M64 108 L74 106" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
              </g>
              <path class="k-brows" d="M64 100 L88 106 M136 100 L112 106" stroke="#7a3e10" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="100" cy="134" rx="9" ry="6.5" fill="#2b1a12"/>
              <path d="M88 146 Q100 156 112 146" stroke="#2b1a12" stroke-width="3.5" fill="none" stroke-linecap="round"/>
              <ellipse cx="60" cy="136" rx="9" ry="5" fill="#ff9f8a" opacity=".55"/><ellipse cx="140" cy="136" rx="9" ry="5" fill="#ff9f8a" opacity=".55"/>
            </svg>
          </div></div>
        </div>
        <div class="k-energy-row">
          <span>⚡ <b id="kEnergy">0</b> / <span id="kEnergyMax">0</span> <small id="kEFull" class="k-efull"></small></span>
          <button class="k-mini" data-kgo="boost" type="button">🚀 <span data-i18n="k.nav.boost"></span></button>
        </div>
        <div class="k-ebar"><i id="kEBar"></i></div>
        <div class="k-fury-row"><span>🔥 <span data-i18n="k.fury"></span></span><div class="k-fbar"><i id="kFBar"></i></div></div>
      </section>
      <section class="k-page" data-kp="cards">
        <div id="kCats" class="k-cats"></div>
        <div id="kCards" class="k-cards"></div>
        <p class="k-note" id="kMemberNote"></p>
      </section>
      <section class="k-page" data-kp="boost">
        <h3 data-i18n="k.boost.free"></h3>
        <div id="kRefill" class="k-boost"></div>
        <h3 data-i18n="k.boost.title"></h3>
        <div id="kBoosts"></div>
        <h3 data-i18n="k.skins"></h3>
        <div id="kSkins" class="k-skins"></div>
      </section>
      <section class="k-page" data-kp="daily">
        <h3 data-i18n="k.daily.t"></h3>
        <p class="k-note" data-i18n="k.daily.d"></p>
        <div id="kDaily" class="k-daily"></div>
        <button id="kDailyBtn" class="btn gold k-wide" type="button"></button>
        <h3 data-i18n="k.tasks"></h3>
        <div id="kTasks" class="k-tasks"></div>
      </section>
      <section class="k-page" data-kp="league">
        <div id="kLeague" class="k-league"></div>
        <h3 data-i18n="k.league.top"></h3>
        <div id="kTop" class="k-top-list"></div>
        <div id="kDrop" class="k-drop"></div>
        <p class="k-note" data-i18n="k.note"></p>
      </section>
    </div>
    <nav class="k-nav">
      <button data-kgo="arena" class="active"><i>⚔️</i><span data-i18n="k.nav.arena"></span></button>
      <button data-kgo="cards"><i>🃏</i><span data-i18n="k.nav.cards"></span></button>
      <button data-kgo="boost"><i>🚀</i><span data-i18n="k.nav.boost"></span></button>
      <button data-kgo="daily"><i>🎯</i><span data-i18n="k.nav.earn"></span><b id="kDailyDot" class="dot hidden"></b></button>
      <button data-kgo="league"><i>🏆</i><span data-i18n="k.nav.league"></span></button>
    </nav>
  </div>

  <main>
    <section id="tab-farm" class="tab active">
      <button id="kombatOpen" class="kombat-banner" type="button">
        <span class="kb-fox">🦊</span>
        <span class="kb-text"><b data-i18n="k.banner.t"></b><small data-i18n="k.banner.d"></small></span>
        <span class="kb-go" data-i18n="k.open"></span>
      </button>
      <div id="missions" class="missions"></div>
      <h2 data-i18n="farm.title"></h2>
      <div class="seed-picker" id="seedPicker"></div>
      <div class="grid" id="farm"></div>
      <p class="hint" data-i18n="farm.hint"></p>
    </section>

    <section id="tab-camels" class="tab">
      <h2 data-i18n="camels.title"></h2>
      <p class="hint" data-i18n="camels.hint"></p>
      <button id="collectBtn" class="btn gold"></button>
      <button id="buyCamelBtn" class="btn secondary mt"></button>
      <h3><span data-i18n="camels.herd"></span> <small id="herdInfo"></small></h3>
      <div id="herd" class="herd"></div>
      <div class="panel mt">
        <p class="hint" data-i18n="camels.breedHint"></p>
        <button id="breedBtn" class="btn" disabled></button>
      </div>
    </section>

    <section id="tab-city" class="tab">
      <h2 data-i18n="city.title"></h2>
      <div class="city-head">
        <div class="medal" id="cityLevel">1</div>
        <div class="xpbar"><i id="cityXpFill"></i><span id="cityXpText"></span></div>
      </div>
      <div class="cstats">
        <div><small data-i18n="city.pop"></small><b id="cityPop">0</b></div>
        <div><small data-i18n="city.happy"></small><b id="cityHappy">+0%</b></div>
        <div><small data-i18n="city.taxRate"></small><b id="cityTaxRate">0</b></div>
      </div>
      <div class="city-scene"><div class="iso" id="iso"></div></div>
      <div class="row city-actions">
        <button id="cityTaxBtn" class="btn gold"></button>
        <button id="cityCollectBtn" class="btn"></button>
      </div>
      <h3 data-i18n="city.orders"></h3>
      <div id="orders" class="orders"></div>
      <h3 data-i18n="city.warehouse"></h3>
      <div id="goods" class="goods"></div>
      <p class="hint" data-i18n="city.hint"></p>
    </section>

    <section id="tab-stake" class="tab">
      <h2 data-i18n="stake.title"></h2>
      <p class="hint" data-i18n="stake.hint"></p>
      <div class="cards" id="stakeOptions"></div>
      <h3><span data-i18n="stake.slots"></span> <small id="slotInfo"></small></h3>
      <div id="stakes" class="list"></div>
    </section>

    <section id="tab-rank" class="tab">
      <h2 data-i18n="rank.title"></h2>
      <div class="prize">
        <span class="trophy">🏆</span>
        <div><small data-i18n="rank.prize"></small><b><span id="prizePool">—</span> Pi</b><small data-i18n="rank.prizeEnd"></small></div>
        <div class="timer"><small data-i18n="rank.left"></small><b id="weekLeft"></b></div>
      </div>
      <div id="podium" class="podium"></div>
      <ol id="leaderboard" class="list rank-list"></ol>
      <p class="hint" data-i18n="rank.hint"></p>
      <p class="hint" data-i18n="rank.camels"></p>
    </section>

    <section id="tab-vip" class="tab">
      <h2 data-i18n="club.title"></h2>
      <div class="panel status" id="clubStatus"></div>
      <p class="hint" data-i18n="club.sub"></p>
      <div id="tiers" class="tiers"></div>
      <p class="hint fair" data-i18n="club.fair"></p>

      <h2 id="shopTitle" data-i18n="shop.title"></h2>
      <p class="hint" data-i18n="shop.sub"></p>
      <div id="shop" class="shop"></div>
      <p class="hint fair" data-i18n="shop.fair"></p>

      <h2 data-i18n="daily.title"></h2>
      <button id="dailyBtn" class="btn secondary"></button>

      <h2 data-i18n="ref.title"></h2>
      <div class="panel">
        <p data-i18n="ref.desc"></p>
        <div class="ref-row">
          <input id="refLink" readonly data-i18n-ph="ref.placeholder">
          <button id="copyRef" class="btn small" data-i18n="ref.copy"></button>
        </div>
        <div class="row" style="margin: 6px 0">
          <button id="shareRef" class="btn small gold" data-i18n="ref.share"></button>
          <button id="copyPiRef" class="btn small secondary" data-i18n="ref.copyPi"></button>
        </div>
        <p class="hint" data-i18n="ref.hintBrowser"></p>
        <p><span data-i18n="ref.code"></span> <b id="refCode">—</b></p>
        <div id="inviterBox" class="hidden">
          <p class="hint" data-i18n="ref.inviterAsk"></p>
          <div class="ref-row">
            <input id="inviterInput" autocomplete="off" data-i18n-ph="ref.inviterPh">
            <button id="saveInviter" class="btn small" data-i18n="ref.save"></button>
          </div>
        </div>
        <p id="invitedBy" class="hint hidden"></p>
        <p><span data-i18n="ref.balance"></span> <b id="refBalance">0</b> Pi · <span data-i18n="ref.count"></span> <b id="refCount">0</b></p>
        <div class="row">
          <button id="redeemVip" class="btn secondary small" data-i18n="ref.redeem"></button>
          <button id="withdraw" class="btn secondary small" data-i18n="ref.withdraw"></button>
        </div>
        <p class="hint" data-i18n="ref.hint"></p>
      </div>

      <!-- Only shown to the owner: grant the Partner membership -->
      <div id="adminBox" class="panel admin hidden">
        <h3 data-i18n="admin.title"></h3>
        <p class="hint" data-i18n="admin.hint"></p>
        <div class="ref-row">
          <input id="partnerInput" autocomplete="off" autocapitalize="off" data-i18n-ph="admin.ph">
          <button id="grantPartner" class="btn small gold" data-i18n="admin.grant"></button>
        </div>
        <div id="partnerList" class="list"></div>
        <div id="playersBox">
          <h3 data-i18n="pl.title"></h3>
          <div id="plStats" class="pl-stats"></div>
          <div class="ref-row">
            <input id="plSearch" autocomplete="off" autocapitalize="off" data-i18n-ph="pl.search">
            <select id="plSort">
              <option value="seen" data-i18n="pl.bySeen"></option>
              <option value="week" data-i18n="pl.byWeek"></option>
              <option value="dates" data-i18n="pl.byDates"></option>
              <option value="refs" data-i18n="pl.byRefs"></option>
              <option value="paid" data-i18n="pl.byPaid"></option>
              <option value="joined" data-i18n="pl.byJoined"></option>
            </select>
          </div>
          <div id="plList" class="list pl-list"></div>
          <button id="plMore" class="btn small secondary hidden" data-i18n="pl.more"></button>
        </div>
        <div id="dropBox">
          <h3 data-i18n="ad.title"></h3>
          <p class="hint" data-i18n="ad.hint"></p>
          <div id="adStats" class="pl-stats"></div>
          <div class="ref-row">
            <select id="adFilter">
              <option value="all" data-i18n="ad.fAll"></option>
              <option value="eligible" data-i18n="ad.fOk"></option>
              <option value="flagged" data-i18n="ad.fFlag"></option>
              <option value="blocked" data-i18n="ad.fBlocked"></option>
            </select>
            <button id="adCsv" class="btn small gold" type="button" data-i18n="ad.csv"></button>
          </div>
          <div id="adList" class="list pl-list"></div>
        </div>
        <div id="giftBox" class="hidden">
          <h3 data-i18n="gift.title"></h3>
          <p class="hint" data-i18n="gift.hint"></p>
          <button id="sendGifts" class="btn small gold" data-i18n="gift.send"></button>
          <div id="giftList" class="list"></div>
        </div>
      </div>

      <p class="hint terms" data-i18n="terms"></p>
      <p class="hint"><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="farm" class="active"><i>🌾</i><span data-i18n="tab.farm"></span><b class="dot hidden"></b></button>
    <button data-tab="camels"><i>🐪</i><span data-i18n="tab.camels"></span><b class="dot hidden"></b></button>
    <button data-tab="city"><i>🏙️</i><span data-i18n="tab.city"></span><b class="dot hidden"></b></button>
    <button data-tab="stake"><i>🏺</i><span data-i18n="tab.stake"></span><b class="dot hidden"></b></button>
    <button data-tab="rank"><i>🏆</i><span data-i18n="tab.rank"></span><b class="dot hidden"></b></button>
    <button data-tab="vip"><i>👑</i><span data-i18n="tab.vip"></span><b class="dot hidden"></b></button>
  </nav>

  <div id="tour" class="tour hidden"></div>
  <div id="help" class="sheet hidden">
    <div class="sheet-bg" id="helpBg"></div>
    <div class="sheet-card" id="helpCard"></div>
  </div>
  <div id="sheet" class="sheet hidden">
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="kombat-logic.js"></script>
  <script src="logic.js"></script>
  <script src="pi.js"></script>
