name = "pi-oasis"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Public link: https://pi-oasis.<account>.workers.dev
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

# No database_id: Wrangler creates the D1 database in the deploying account
# automatically on first deploy. The Worker creates its own tables (src/worker.js).
[[d1_databases]]
binding = "DB"
# The Testnet players' progress lives in this database (it was used by the Testnet Worker).
database_name = "pi-oasis-main-db"

# Per-app settings (not secret). Each Pi app has its own domain validation key and link.
[vars]
VALIDATION_KEY = "7c51468ad7937a22873ad4adf0fd7d80b1be68a1f78733624eb98d53c35fe3985aacf7642e50d4d5ee31e85304b4542b08ff9c6322821708bf153f78d54cad8d"
PUBLIC_URL = "https://oasisgame6033.pinet.com"
# Pi usernames allowed to grant the Partner membership (comma separated)
ADMIN_USERNAMES = "jaouich"
# Testnet only: owner can send 0.01 test-Pi gifts (Pi portal needs A2U to 5 wallets before Mainnet)
TESTNET_GIFTS = "1"
# test JRY token (Pi Testnet). The issuer secret goes in the Cloudflare secret JRY_ISSUER_SEED.
JRY_CODE = "testJRY"
JRY_HOME = "pi-oasis.jaouich.workers.dev"

# Hourly run: weekly prizes and referral withdrawals (App-to-User payments)
[triggers]
crons = ["23 * * * *"]

# Secrets (set in the Cloudflare dashboard, never in this file):
#   PI_NETWORK_API_KEY – Pi Developers → this app → Settings → API key
#   PI_STUDIO_API_KEY – optional: the API key of the App Studio app "Pi Oasis", so memberships
#                       can also be bought from that app
#   PI_WALLET_SEED – the app wallet's secret key (S...), needed only for payouts
#   ADMIN_TOKEN  – a long password of your choice


# ---------------------------------------------------------------------------
# Mainnet copy of the game (real Pi). Pi links each domain to one app, so the
# Mainnet app gets its own address, database and secrets:
#   https://pi-oasis-main.jaouich.workers.dev
# Deploy: npx wrangler deploy --env main
# Secrets to set on the "jaouich" (Mainnet) Worker: PI_NETWORK_API_KEY, PI_WALLET_SEED
[env.main]
# Must match the Worker name in the Cloudflare dashboard (Workers Builds checks this)
name = "jaouich"
workers_dev = true

[env.main.vars]
VALIDATION_KEY = "cfb33204e47b668bdf431d538a789aee8d5c9ad41e8776add3badba149589757ed2624b7483fcfa080e4a303b76e13805a954244fb95e966be6fa5d9049c21f3"
PUBLIC_URL = "https://jaouich.jaouich.workers.dev"
ADMIN_USERNAMES = "jaouich"

[[env.main.d1_databases]]
binding = "DB"
database_name = "pi-oasis-mainnet-db"

[env.main.triggers]
crons = ["23 * * * *"]
