name = "pi-oasis"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Public link: https://pi-oasis.<account>.workers.dev
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

# No database_id: Wrangler creates the D1 database in the deploying account
# automatically on first deploy. The Worker creates its own tables (src/worker.js).
[[d1_databases]]
binding = "DB"
database_name = "pi-oasis-db"

# Secrets (set in the Cloudflare dashboard, never in this file):
#   PI_NETWORK_API_KEY – Pi Developers → this app → Settings → API key
#   ADMIN_TOKEN  – a long password of your choice

# Second copy of the game for the Pi Developer Portal app "Oasis pi JDT".
# Pi links a domain to one app, so this app needs its own address:
#   https://pi-oasis-jdt.jaouich.workers.dev
# Deploy with: npx wrangler deploy --env jdt
[env.jdt]
name = "pi-oasis-jdt"
workers_dev = true

[[env.jdt.d1_databases]]
binding = "DB"
database_name = "pi-oasis-jdt-db"
