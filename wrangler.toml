name = "magiscom-tech-desk"
main = "dist/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Adresse publique de l'application
routes = [
  { pattern = "support.integrateurebp.com", custom_domain = true }
]

[vars]
APP_URL = "https://support.integrateurebp.com"
MAIL_FROM = "support@integrateurebp.com"

# Nettoyage chaque nuit des fichiers envoyés mais jamais joints à un message
[triggers]
crons = ["30 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "magisdesk"
database_id = "ea4e91e5-967d-4446-8204-aa32376e9c13"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "magisdesk-media"
